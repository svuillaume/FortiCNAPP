gzip on;
gzip_types text/html text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 5;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header X-XSS-Protection        "1; mode=block"                    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;

    # Static assets — cache aggressively
    location ~* \.(css|js|json|svg|png|jpg|jpeg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # HTML — never cache so updates appear immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        expires 0;
    }

    # Health probe (used by docker healthcheck and load balancers)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Redirect bare root → /FortiCNAPP/ to match the GitHub Pages URL structure
    location = / {
        return 301 /FortiCNAPP/;
    }

    # Main site — mirrors the GitHub Pages subpath so all internal links work unchanged
    location /FortiCNAPP/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
