version: "3.9"

services:
  web:
    build: .
    image: genaisec:local
    ports:
      - "8080:80"
    volumes:
      # Mount docs/ so edits show without rebuilding the image
      - ./docs:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
