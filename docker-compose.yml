services:
  web:
    build: .
    image: genaisec:https
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
